# One-click deploy on Render: https://render.com/deploy
# You will be asked for GEMINI_API_KEY (free: https://aistudio.google.com/apikey)
# and JARVIS_ACCESS_TOKEN (the password for your JARVIS site).
services:
  - type: web
    name: jarvis
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: JARVIS_ACCESS_TOKEN
        sync: false
      - key: JARVIS_TIMEZONE
        value: Asia/Bangkok
