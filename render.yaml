# One-click deploy on Render: https://render.com/deploy
# You will be asked for OLLAMA_API_KEY and JARVIS_ACCESS_TOKEN (your login password).
services:
  - type: web
    name: jarvis
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OLLAMA_API_KEY
        sync: false
      - key: JARVIS_ACCESS_TOKEN
        sync: false
      - key: JARVIS_TIMEZONE
        value: Asia/Bangkok
